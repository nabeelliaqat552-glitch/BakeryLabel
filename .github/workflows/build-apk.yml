name: Build Bakery Label Studio APK

on:
  push:
    branches: [bakery-label-studio]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle offline libraries and fonts
        run: |
          L=app/src/main/assets/lib
          mkdir -p $L
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o $L/jspdf.umd.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js -o $L/jszip.min.js
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/notonastaliqurdu/NotoNastaliqUrdu%5Bwght%5D.ttf" -o $L/NotoNastaliqUrdu.ttf || echo "Urdu font skipped"
          for w in Regular Medium SemiBold Bold ExtraBold; do
            curl -fsSL "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf" -o $L/Poppins-$w.ttf || echo "Poppins $w skipped"
          done
          ls -la $L

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk BakeryLabelStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BakeryLabelStudio-APK
          path: BakeryLabelStudio.apk

      - name: Publish release (download link for phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bakery Label Studio v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Bakery Label Studio — Android app.
            Phone par **BakeryLabelStudio.apk** download karein aur install karein
            (pehli dafa "Install unknown apps" ki ijazat deni hogi).
          files: BakeryLabelStudio.apk
