name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          DIR=$(dirname "$(find . -name gradlew -not -path '*/node_modules/*' | head -1)")
          echo "Project folder: $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/BakeryLabel.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BakeryLabel-APK
          path: BakeryLabel.apk

      - name: Publish APK as a download link (Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" BakeryLabel.apk --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "Bakery Labels APK (build ${{ github.run_number }})" \
            --notes "Download BakeryLabel.apk below and install it on your Android phone (Android 8.0+)." --latest
