name: Build APK

on:
  push:
    branches: [ main, master, foodlabel-studio ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLS_KEYSTORE_BASE64: ${{ secrets.FLS_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (optional)
        if: ${{ env.FLS_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$FLS_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks
          echo "FLS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          FLS_KEYSTORE_PASSWORD: ${{ secrets.FLS_KEYSTORE_PASSWORD }}
          FLS_KEY_ALIAS: ${{ secrets.FLS_KEY_ALIAS }}
          FLS_KEY_PASSWORD: ${{ secrets.FLS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/FoodLabelStudio-debug.apk
          cp app/build/outputs/apk/release/*.apk out/FoodLabelStudio-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FoodLabelStudio-APKs
          path: out/*.apk

      - name: Publish release with APK download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "foodlabel-build-${{ github.run_number }}" out/*.apk \
            --target "${{ github.sha }}" \
            --title "FoodLabel Studio build ${{ github.run_number }}" \
            --notes "Install FoodLabelStudio-release.apk on your phone. The debug APK is for testing."

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
