name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          DIR=$(dirname "$(find . -name gradlew -not -path '*/node_modules/*' | head -1)")
          echo "Project folder: $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/BakeryLabel.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BakeryLabel-APK
          path: BakeryLabel.apk
