<!DOCTYPE html>
<html lang="en">
<head>
<!--H0-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bakery Label Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#5a9a22;--gd:#356812;--gl:#8cc63e;--gp:#eef5e3;--bg:#f4f6f0;--ink:#1c2614;--mut:#7d8775;--card:#fff;--line:#e5eadd;--red:#e0483e;--sh:0 6px 22px rgba(40,70,10,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#e6ebdf;color:var(--ink);font-family:Poppins,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:110px;overflow-x:hidden}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* splash */
#splash{position:fixed;inset:0;z-index:99;background:#f3f6ee;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
#splash h1{font-size:46px;font-weight:800;margin:10px 0 0;letter-spacing:-1px}
#splash h1 span{color:var(--gl)}
#splash p{color:var(--mut);margin:4px 0 0;font-size:14px}
#splash .skip{position:absolute;top:calc(18px + env(safe-area-inset-top));inset-inline-end:22px;color:var(--g);font-weight:600;font-size:14px}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
/* hero */
.hero{background:linear-gradient(165deg,#6eae2e 0%,#4c8a1c 55%,#356812 100%);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.hrow{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.hrow small{display:block;font-size:11px;opacity:.85}
.hrow b{font-size:17px;font-weight:700}
.hrow .sp{flex:1;min-width:0}
.icb{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff;position:relative}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:20px;margin-top:3px}
.sync i{width:6px;height:6px;border-radius:50%;background:#c8f08f;display:inline-block}
.sync.busy i{background:#ffd56b;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.promo{margin-top:18px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:16px;display:flex;gap:10px;align-items:center;position:relative;z-index:1}
.promo .pill{display:inline-block;background:#2b5410;color:#d6f3a8;font-size:9.5px;font-weight:700;letter-spacing:1.2px;padding:4px 10px;border-radius:20px}
.promo h2{margin:8px 0 2px;font-size:21px;line-height:1.15;font-weight:800}
.promo h2 span{color:#d8f5a2}
.promo p{margin:0;font-size:11.5px;opacity:.85}
.promo .btns{display:flex;gap:6px;margin-top:10px}
.chipw{background:#fff;color:var(--gd);font-weight:600;font-size:11.5px;padding:7px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}
.chipg{background:rgba(255,255,255,.2);color:#fff;font-weight:600;font-size:11.5px;padding:7px 12px;border-radius:20px}
.search{margin:16px 0 0;background:#fff;border-radius:18px;display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--g);box-shadow:var(--sh);position:relative;z-index:1}
.search input{flex:1;border:0;outline:0;padding:15px 0;font-size:14px;background:none;color:var(--ink)}
.search input::placeholder{color:#a5ad9c}
/* sections */
.sec{padding:0 18px}
.sh{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.sh h3{margin:0;font-size:17px;font-weight:700;border-inline-start:4px solid var(--g);padding-inline-start:9px;line-height:1.1}
.sh a,.sh button{color:var(--g);font-weight:600;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:#fff;border-radius:18px;padding:12px;box-shadow:var(--sh)}
.stat b{display:block;font-size:20px;font-weight:800;color:var(--gd)}
.stat span{font-size:11px;color:var(--mut)}
.cats{display:flex;gap:14px;overflow-x:auto;padding:4px 18px 6px;margin:0 -18px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:68px}
.cat .c{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:28px;box-shadow:var(--sh);border:2.5px solid transparent;transition:.2s}
.cat.on .c{border-color:var(--g);background:var(--gp)}
.cat span{font-size:11.5px;font-weight:500;text-align:center;line-height:1.2}
.cat.on span{color:var(--g);font-weight:700}
.cat .n{font-size:10px;color:var(--mut);margin-top:-5px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qk{background:#fff;border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;box-shadow:var(--sh)}
.qk .qi{width:40px;height:40px;border-radius:14px;background:var(--gp);color:var(--g);display:grid;place-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border-radius:22px;padding:13px 13px 12px;box-shadow:var(--sh);position:relative;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.98)}
.card .t{font-size:13.5px;font-weight:700;line-height:1.25;padding-inline-end:22px;min-height:34px}
.card .pr{font-size:12px;color:var(--mut);font-weight:500;margin-top:1px}
.card .em{width:96px;height:96px;margin:8px auto 6px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#f2f7ea 0,#e8f0dc 70%);display:grid;place-items:center;font-size:50px}
.card .mt{font-size:10.5px;color:var(--mut);line-height:1.6}
.card .mt b{color:#e0702b;font-weight:600}
.card .plus{position:absolute;inset-inline-end:12px;bottom:12px;width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(90,154,34,.35)}
.card .plus svg{width:18px;height:18px;stroke-width:2.6}
.card .qb{position:absolute;inset-inline-end:12px;bottom:46px;background:#e0702b;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px}
.card .bc{font-size:9.5px;color:#a2aa98;letter-spacing:.6px;font-family:ui-monospace,Menlo,monospace}
.card .tagc{position:absolute;inset-inline-end:11px;top:12px;font-size:16px}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .e{font-size:54px}
/* bottom nav */
nav.bn{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;align-items:flex-end;padding:8px 6px calc(10px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(30,50,10,.08);z-index:20}
nav.bn button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#a7ae9f;font-weight:500;width:64px;position:relative}
nav.bn button.on{color:var(--g);font-weight:700}
nav.bn button.on:before{content:"";position:absolute;top:-8px;width:22px;height:3px;border-radius:3px;background:var(--g)}
nav.bn .scan{width:62px;height:62px;border-radius:50%;background:linear-gradient(150deg,#7cbc35,#3d7416);color:#fff;display:grid;place-items:center;margin-top:-34px;box-shadow:0 8px 20px rgba(70,130,20,.45);border:5px solid var(--bg)}
nav.bn .scan svg{width:26px;height:26px}
nav.bn .bdg{position:absolute;top:-4px;inset-inline-end:12px;background:#e0702b;color:#fff;font-size:9.5px;font-weight:700;border-radius:10px;padding:0 6px;line-height:16px}
/* top bars for inner views */
.top{padding:calc(16px + env(safe-area-inset-top)) 18px 6px;display:flex;align-items:center;gap:12px}
.top h2{margin:0;font-size:22px;font-weight:800;flex:1}
.top .sub{font-size:12px;color:var(--mut);font-weight:500}
.panel{background:#fff;border-radius:22px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.panel h4{margin:0 0 10px;font-size:14px;font-weight:700}
/* forms */
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:12px;font-weight:600;color:#56604d;margin:0 0 5px 2px}
.in{width:100%;background:#f3f6ee;border:1.5px solid transparent;border-radius:14px;padding:12px 14px;font-size:14px;outline:0;transition:.15s}
.in:focus{border-color:var(--gl);background:#fff}
textarea.in{resize:vertical;min-height:62px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.inbtn{display:flex;gap:8px}
.inbtn .in{flex:1}
.mini{background:var(--gp);color:var(--gd);border-radius:12px;padding:0 12px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:18px;font-weight:700;font-size:15px;background:linear-gradient(90deg,#4f8a1f,#86c23b);color:#fff;box-shadow:0 8px 18px rgba(90,154,34,.3)}
.btn.sec2{background:#fff;color:var(--gd);border:1.5px solid var(--line);box-shadow:none}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid #f5d3cf;box-shadow:none}
.btn:disabled{opacity:.5}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:#f0f3ea;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-size:12.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--gd);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.tpls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tpl{border:2px solid var(--line);border-radius:14px;padding:8px 4px 6px;font-size:11px;font-weight:600;text-align:center;background:#fff}
.tpl.on{border-color:var(--g);background:var(--gp);color:var(--gd)}
.tpl .sw{height:26px;border-radius:6px;margin-bottom:5px;border:1px solid #ddd;position:relative;overflow:hidden;background:#fff}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swc{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.swc.on{box-shadow:0 0 0 2.5px var(--ink)}
.swatches input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;border-radius:50%}
.tgl{display:flex;flex-wrap:wrap;gap:7px}
.tg{padding:7px 12px;border-radius:20px;font-size:12px;font-weight:600;background:#f0f3ea;color:var(--mut);display:inline-flex;gap:5px;align-items:center}
.tg.on{background:var(--g);color:#fff}
.prev{background:repeating-conic-gradient(#eef1e9 0 25%,#f7f9f3 0 50%) 0 0/16px 16px;border-radius:18px;padding:18px;display:flex;justify-content:center;align-items:center;min-height:150px}
.prev svg.lbl{box-shadow:0 6px 18px rgba(0,0,0,.14);border-radius:3px;background:#fff;max-width:100%;height:auto}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{font-size:22px;padding:6px 0;border-radius:12px;background:#f3f6ee}
.emojis button.on{background:var(--gp);box-shadow:inset 0 0 0 2px var(--g)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.switch b{font-size:13.5px;font-weight:600}
.switch small{display:block;color:var(--mut);font-size:11.5px;font-weight:400}
.sw-t{width:46px;height:27px;border-radius:20px;background:#d6dccf;position:relative;flex:none;transition:.2s}
.sw-t:after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw-t.on{background:var(--g)}
.sw-t.on:after{left:22px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .ov{position:absolute;inset:0;background:rgba(20,30,10,.45);animation:fade .2s}
#sheet .pn{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;max-height:93vh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
#sheet .grab{width:44px;height:5px;border-radius:5px;background:#cfd6c6;margin:2px auto 10px}
.shh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.shh h3{margin:0;font-size:19px;font-weight:800;flex:1}
.x{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--sh)}
@keyframes up{from{transform:translate(-50%,100%)}}
@keyframes fade{from{opacity:0}}
/* dialog */
#dlg{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(20,30,10,.5);padding:24px}
#dlg.open{display:flex}
#dlg .bx{background:#fff;border-radius:24px;padding:22px;max-width:340px;width:100%;text-align:center;animation:pop .2s}
#dlg .ic{font-size:40px}
#dlg h4{margin:6px 0 6px;font-size:17px}
#dlg p{margin:0 0 18px;color:var(--mut);font-size:13.5px}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#toast{position:fixed;left:50%;bottom:108px;transform:translateX(-50%) translateY(20px);background:#1f2b14;color:#fff;padding:11px 18px;border-radius:16px;font-size:13px;font-weight:500;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* detail */
.dt-hero{background:#fff;border-radius:24px;padding:16px;display:flex;gap:14px;align-items:center;box-shadow:var(--sh)}
.dt-hero .em{width:78px;height:78px;border-radius:50%;background:var(--gp);display:grid;place-items:center;font-size:42px;flex:none}
.dt-hero h3{margin:0;font-size:18px;font-weight:800;line-height:1.2}
.dt-hero .p{color:var(--g);font-weight:800;font-size:20px;margin-top:3px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.kv div{background:#fff;border-radius:16px;padding:10px 12px;box-shadow:var(--sh)}
.kv small{display:block;color:var(--mut);font-size:11px}
.kv b{font-size:13.5px;font-weight:600;word-break:break-all}
.qty{display:flex;align-items:center;background:#fff;border-radius:14px;border:1.5px solid var(--line)}
.qty button{width:38px;height:40px;display:grid;place-items:center;color:var(--gd)}
.qty input{width:44px;border:0;text-align:center;font-weight:700;font-size:15px;outline:0;background:none}
/* scan */
.scanbox{background:linear-gradient(160deg,#284d0f,#1b330b);border-radius:26px;padding:24px 18px;color:#fff;text-align:center;position:relative;overflow:hidden}
.scanbox .fr{width:220px;height:130px;margin:6px auto 16px;position:relative;display:grid;place-items:center}
.scanbox .fr:before,.scanbox .fr:after{content:"";position:absolute;inset:0;border:3px solid #9ee04f;border-radius:18px;clip-path:polygon(0 0,30% 0,30% 6%,6% 6%,6% 30%,0 30%,0 70%,6% 70%,6% 94%,30% 94%,30% 100%,0 100%,0 0,100% 0,100% 30%,94% 30%,94% 6%,70% 6%,70% 0,100% 0,100% 100%,70% 100%,70% 94%,94% 94%,94% 70%,100% 70%,100% 100%)}
.scanbox .ln{position:absolute;left:8%;right:8%;height:2px;background:#ff5b4a;box-shadow:0 0 12px #ff5b4a;animation:scanl 2s ease-in-out infinite;top:15%}
@keyframes scanl{50%{top:85%}}
.scanbox .bars{display:flex;gap:2px;height:70px;align-items:stretch;opacity:.9}
.scanbox .bars i{background:#fff;display:block}
.scanbox h3{margin:0;font-size:18px}
.scanbox p{margin:4px 0 16px;font-size:12.5px;opacity:.75}
.scanin{display:flex;gap:8px;background:#fff;border-radius:16px;padding:5px 5px 5px 14px;align-items:center}
.scanin input{flex:1;border:0;outline:0;font-size:15px;padding:9px 0;letter-spacing:1px;color:var(--ink);background:none;min-width:0}
.scanin button{background:var(--g);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:13px}
.camb{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.14);border-radius:16px;padding:13px;font-weight:600;font-size:14px;width:100%;color:#fff}
.li{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 12px;box-shadow:var(--sh);margin-bottom:10px}
.li .em{width:46px;height:46px;border-radius:14px;background:var(--gp);display:grid;place-items:center;font-size:24px;flex:none}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx small{color:var(--mut);font-size:11.5px}
.tip{background:#fff8e6;border:1px solid #f4e2b4;color:#7a5a12;border-radius:16px;padding:11px 13px;font-size:12px;line-height:1.5;margin-bottom:14px}
.sheetprev{background:#fff;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);margin:0 auto;position:relative;overflow:hidden}
.sheetprev svg{position:absolute}
.loading{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.catrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow .e{width:40px;height:40px;border-radius:12px;background:var(--gp);display:grid;place-items:center;font-size:20px}
.catrow .nm{flex:1;font-weight:600;font-size:13.5px}
.catrow .nm small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.icbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:#f3f6ee;color:var(--gd)}
.icbtn.r{color:var(--red);background:#fdf0ee}
.icbtn svg{width:18px;height:18px}

/* photos */
.logo{overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}
.cat .c{overflow:hidden}.cat .c img{width:100%;height:100%;object-fit:cover}
.card .em.ph{width:100%;height:120px;border-radius:16px;overflow:hidden;background:#eef2e8}
.card .em img,.li .em img,.dt-hero .em img{width:100%;height:100%;object-fit:cover;display:block}
.li .em{overflow:hidden}
.bigph{border-radius:24px;overflow:hidden;margin-bottom:12px;box-shadow:var(--sh);background:#eef2e8;aspect-ratio:4/3}
.bigph img{width:100%;height:100%;object-fit:cover;display:block}
.dt-hero .alt{font-size:15px;color:var(--gd);font-weight:600}
.phbox{display:flex;gap:14px;align-items:center}
.phbox b{display:block;font-size:14px}
.phbox small{display:block;color:var(--mut);font-size:11.5px}
.phprev{width:92px;height:92px;border-radius:20px;background:var(--gp);display:grid;place-items:center;font-size:46px;overflow:hidden;flex:none;border:2px dashed #c9dbb0}
.phprev.round{border-radius:50%;width:70px;height:70px;font-size:34px}
.phprev img{width:100%;height:100%;object-fit:cover}
.phbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.phbtns .mini{padding:8px 12px}
.mini.rm{background:#fdf0ee;color:var(--red)}
.langb{height:34px;padding:0 12px;border-radius:20px;background:#fff;color:var(--gd);font-weight:700;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.top .langb{background:var(--gp);box-shadow:none}
/* urdu */
html[lang=ur] body,html[lang=ur] button,html[lang=ur] input,html[lang=ur] select,html[lang=ur] textarea{font-family:'Noto Nastaliq Urdu',Poppins,serif}
html[lang=ur] .app,html[lang=ur] nav.bn,html[lang=ur] #sheet,html[lang=ur] #dlg,html[lang=ur] #toast{line-height:2}
html[lang=ur] .promo h2,html[lang=ur] .sh h3,html[lang=ur] .card .t,html[lang=ur] .top h2,html[lang=ur] .dt-hero h3,html[lang=ur] .shh h3{line-height:1.9;font-weight:700}
html[lang=ur] .promo h2{font-size:19px}
html[lang=ur] .top h2{font-size:20px}
html[lang=ur] .card .t{font-size:13px;min-height:40px}
html[lang=ur] .stat span,html[lang=ur] .cat>span:not(.c),html[lang=ur] nav.bn button{font-size:10.5px}
html[lang=ur] .cat .n{margin-top:-10px}
html[lang=ur] .promo .pill{letter-spacing:0}
html[lang=ur] .bc,html[lang=ur] .pr,html[lang=ur] .kv b,html[lang=ur] .stat b{font-family:Poppins,system-ui,sans-serif}
.ur-in{font-family:'Noto Nastaliq Urdu',serif!important;line-height:2}
.prn{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:#f6f8f2;border:2px solid transparent;border-radius:16px;padding:10px 12px;margin-bottom:8px}
.prn.on{border-color:var(--g);background:var(--gp)}
.prn .pi{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:18px;color:#1f6fb2;flex:none}
.prn .pt{flex:1;min-width:0}.prn b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prn small{font-size:11px;color:var(--mut)}
.prn .ck{width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center}
.pact{display:flex;gap:8px}.pact .mini{padding:8px 12px}
.seg.col{flex-direction:column}
.catrow .e svg{color:#1f6fb2}
@media (min-width:520px){.app{box-shadow:0 0 40px rgba(0,0,0,.08)}}

/* ---------- label renderer (SVG, mm units) ---------- */
function fitText(t, size, maxW){ const cw = size * 0.56; const n = Math.max(2, Math.floor(maxW / cw)); return t.length > n ? t.slice(0, n - 1) + '…' : t; }
function txt(t, x, y, s, fill, wt, anchor, maxW){
  return '<text x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" font-size="'+s.toFixed(2)+'" font-weight="'+wt+'" fill="'+fill+'" text-anchor="'+anchor+'" font-family="Helvetica, Arial, sans-serif">'+esc(fitText(String(t), s, maxW))+'</text>';
}
function labelSVG(it, L, pxW, cls){
  const [W, H] = L.size.split('x').map(Number);
  const f = L.fields, A = L.accent, tpl = L.tpl;
  const p = Math.max(1.3, Math.min(W, H) * 0.06);
  const maxW = W - 2*p;
  const center = tpl !== 'minimal';
  const tx = center ? W/2 : p, an = center ? 'middle' : 'start';
  const o = ['<rect width="'+W+'" height="'+H+'" fill="#fff"/>'];
  let y = p * 0.9;
  const vegT = f.veg && (it.veg === 'veg' || it.veg === 'nonveg') ? it.veg : '';
  const nb = (f.halal ? 1 : 0) + (vegT ? 1 : 0);
  const bs = Math.min(H * 0.18, W * 0.13), bgap = 0.6;
  const used = nb ? nb * (bs + bgap) : 0;
  const topMax = center ? maxW - 2 * used : maxW - used;
  if (tpl === 'classic') o.push('<rect x=".45" y=".45" width="'+(W-.9)+'" height="'+(H-.9)+'" rx="1.8" fill="none" stroke="'+A+'" stroke-width=".5"/>');
  if (tpl === 'bold') o.push('<rect x=".5" y=".5" width="'+(W-1)+'" height="'+(H-1)+'" rx="1" fill="none" stroke="#111" stroke-width="1"/>');
  if (tpl === 'minimal') o.push('<rect x="0" y="0" width="1.4" height="'+H+'" fill="'+A+'"/>');
  if (tpl === 'modern') {
    const bh = H * 0.2; o.push('<rect width="'+W+'" height="'+bh+'" fill="'+A+'"/>');
    if (f.shop) { const s = bh * 0.55; o.push(txt(S.settings.shop, tx, bh/2 + s*0.36, s, '#fff', 700, an, topMax)); }
    y = bh + p * 0.4;
  } else if (f.shop) { const s = H * 0.08; y += s * 0.8; o.push(txt(S.settings.shop.toUpperCase(), tx, y, s, A, 700, an, topMax)); y += s * 0.35; }
  if (f.phone && S.settings.phone) { const s = H * 0.058; y += s; o.push(txt('Ph: ' + S.settings.phone, tx, y, s, '#555', 500, an, topMax)); y += s * 0.35; }
  if (nb) {
    const by = tpl === 'modern' ? Math.max(0.5, (H * 0.2 - bs) / 2) : p * 0.6;
    let bx = W - p * 0.8 - bs;
    if (f.halal) {
      const r = bs / 2, cx = bx + r, cy = by + r;
      o.push('<circle cx="'+cx.toFixed(2)+'" cy="'+cy.toFixed(2)+'" r="'+(r-0.15).toFixed(2)+'" fill="#fff" stroke="#17803a" stroke-width=".35"/>');
      o.push('<text x="'+cx.toFixed(2)+'" y="'+(cy + r*0.12).toFixed(2)+'" font-size="'+(r*0.78).toFixed(2)+'" text-anchor="middle" font-weight="700" fill="#17803a" font-family="\'Noto Nastaliq Urdu\', \'Noto Naskh Arabic\', serif">حلال</text>');
      o.push('<text x="'+cx.toFixed(2)+'" y="'+(cy + r*0.68).toFixed(2)+'" font-size="'+(r*0.3).toFixed(2)+'" text-anchor="middle" font-weight="700" fill="#17803a" font-family="Helvetica, Arial, sans-serif" letter-spacing=".1">HALAL</text>');
      bx -= bs + bgap;
    }
    if (vegT) {
      const col = vegT === 'veg' ? '#1b8a3a' : '#8b2d1d', q = bs * 0.82, qx = bx + (bs - q), qy = by + (bs - q) / 2;
      o.push('<rect x="'+qx.toFixed(2)+'" y="'+qy.toFixed(2)+'" width="'+q.toFixed(2)+'" height="'+q.toFixed(2)+'" rx=".3" fill="#fff" stroke="'+col+'" stroke-width=".4"/>');
      const cx = qx + q/2, cy = qy + q/2, rr = q * 0.28;
      o.push(vegT === 'veg' ? '<circle cx="'+cx.toFixed(2)+'" cy="'+cy.toFixed(2)+'" r="'+rr.toFixed(2)+'" fill="'+col+'"/>'
        : '<path d="M'+cx.toFixed(2)+' '+(cy-rr).toFixed(2)+'L'+(cx+rr*1.1).toFixed(2)+' '+(cy+rr*0.8).toFixed(2)+'L'+(cx-rr*1.1).toFixed(2)+' '+(cy+rr*0.8).toFixed(2)+'Z" fill="'+col+'"/>');
    }
  }
  if (f.name) {
    const nm = tpl === 'bold' ? it.name.toUpperCase() : it.name;
    let s = H * (tpl === 'bold' ? 0.14 : 0.13);
    if (nm.length * s * 0.56 > maxW) s = Math.max(H * 0.095, maxW / (nm.length * 0.56));
    if (nm.length * s * 0.56 > topMax && y < p + bs) s = Math.max(H * 0.09, topMax / (nm.length * 0.56));
    y += s * 0.92; o.push(txt(nm, tx, y, s, '#111', 700, an, y - s < p + bs ? topMax : maxW)); y += s * 0.28;
  }
  if (f.urdu && it.nameUr) {
    const s = H * 0.105; y += s * 1.15;
    o.push('<text x="'+(center ? W/2 : W - p).toFixed(2)+'" y="'+y.toFixed(2)+'" font-size="'+s.toFixed(2)+'" font-weight="700" fill="#222" text-anchor="'+(center?'middle':'start')+'" direction="rtl" font-family="\'Noto Nastaliq Urdu\', \'Jameel Noori Nastaleeq\', \'Urdu Typesetting\', serif">'+esc(fitText(it.nameUr, s, maxW))+'</text>');
    y += s * 0.45;
  }
  const meta = [];
  if (f.weight && it.weight) meta.push(it.weight);
  if (f.cat) meta.push(catOf(it.cat).name);
  if (f.batch) meta.push('Batch ' + batchOf(it));
  if (meta.length) { const s = H * 0.068; y += s; o.push(txt(meta.join('  •  '), tx, y, s, '#444', 500, an, maxW)); y += s * 0.3; }
  if (f.mfg || f.exp) {
    const [m, e] = dates(it); const s = H * 0.064; y += s;
    if (f.mfg && f.exp) {
      const gap = Math.max(2.5, W * 0.07); const half = (maxW - gap) / 2;
      if (center) { o.push(txt('MFG ' + m, W/2 - gap/2, y, s, '#222', 600, 'end', half)); o.push(txt('EXP ' + e, W/2 + gap/2, y, s, '#222', 600, 'start', half)); }
      else { o.push(txt('MFG ' + m, p, y, s, '#222', 600, 'start', half)); o.push(txt('EXP ' + e, p + half + gap, y, s, '#222', 600, 'start', half)); }
    } else o.push(txt(f.mfg ? 'MFG ' + m : 'EXP ' + e, tx, y, s, '#222', 600, an, maxW));
    y += s * 0.3;
  }
  if (f.ingr && it.ingr) { const s = H * 0.054; y += s; o.push(txt('Ingredients: ' + it.ingr, tx, y, s, '#555', 400, an, maxW)); y += s * 0.3; }
  y += p * 0.35;
  const avail = H - p * 0.85 - y;
  const ps = money(it.price);
  if (f.barcode && it.barcode && avail > 3) {
    const bw = f.price ? maxW * 0.6 : maxW;
    const ds = Math.min(H * 0.068, avail * 0.24); const bh = avail - ds - 0.35;
    o.push(barsSVG(it.barcode, p - (f.price ? 1 : 0), y, bw, bh, ds));
    if (f.price) {
      const area = maxW - bw - 0.5; const ax = W - p - area;
      let s = Math.min(avail * 0.4, H * 0.17, area / (ps.length * 0.6));
      if (tpl === 'bold') {
        o.push('<rect x="'+ax.toFixed(2)+'" y="'+y.toFixed(2)+'" width="'+area.toFixed(2)+'" height="'+avail.toFixed(2)+'" rx="1.2" fill="'+A+'"/>');
        o.push(txt('PRICE', ax + area/2, y + avail/2 - s*0.55, s*0.42, '#fff', 600, 'middle', area));

      }
    }

    const s = Math.max(2, Math.min(avail * 0.7, H * 0.24));
    o.push(txt(ps, W/2, y + avail/2 + s*0.36, s, A, 800, 'middle', maxW));
  }
  const pw = pxW || W * 5;
  return '<svg xmlns="http://www.w3.org/2000/svg" direction="ltr" style="direction:ltr" class="'+(cls||'lbl')+'" viewBox="0 0 '+W+' '+H+'" width="'+pw+'" height="'+(pw*H/W).toFixed(1)+'">'+o.join('')+'</svg>';
}

function applyLC(L, el){
  const k = el.dataset.lc, v = el.dataset.v;
  if (k === 'tpl') L.tpl = v;
  else if (k === 'size') L.size = v;
  else if (k === 'accent') L.accent = v;
  else if (k === 'color') L.accent = el.value;
  else if (k === 'field') L.fields[v] = !L.fields[v];
  else if (k === 'w' || k === 'h') {
    const sc = el.closest('.lc'); const w = Math.min(150, Math.max(15, +sc.querySelector('[data-lc=w]').value || 50)); const h = Math.min(150, Math.max(10, +sc.querySelector('[data-lc=h]').value || 30));
    L.size = w + 'x' + h; return false;
  }
  return true;
}

function expandQueue(){
  const out = [];
  if (GROUPS_OVERRIDE) { GROUPS_OVERRIDE.forEach(g => { for (let k = 0; k < g.qty; k++) out.push(g.it); }); return out; }
  S.queue.forEach(q => { const it = S.items.find(i => i.id === q.id); if (it) for (let k = 0; k < q.qty; k++) out.push(it); });
  return out;
}
function layoutA4(list){
  const PW = 210, PH = 297, M = 8, G = S.print.gap || 2; const pages = [[]]; let x = M, y = M, rh = 0;
  list.forEach(it => {
    const [W, H] = labelOf(it).size.split('x').map(Number);
    if (x + W > PW - M + 0.01) { x = M; y += rh + G; rh = 0; }
    if (y + H > PH - M + 0.01) { pages.push([]); x = M; y = M; rh = 0; }
    pages[pages.length - 1].push({it, x, y, W, H}); x += W + G; rh = Math.max(rh, H);
  });
  return pages;
}

  const box = $('#sprev'); if (!box) return;

  const pages = layoutA4(list); const wpx = Math.min(box.clientWidth || 300, 340); const k = wpx / 210;
  box.innerHTML = pages.map((pg, i) => '<div class="sheetprev" style="width:'+wpx+'px;height:'+(297*k)+'px;margin-bottom:12px">' + pg.map(c => '<div style="position:absolute;left:'+(c.x*k)+'px;top:'+(c.y*k)+'px">'+labelSVG(c.it, labelOf(c.it), c.W*k)+'</div>').join('') + '<span style="position:absolute;right:6px;bottom:4px;font-size:9px;color:#aaa">'+(i+1)+'/'+pages.length+'</span></div>').join('');
}

/* ---------- scanning ---------- */
function handleScan(code){
  code = String(code || '').trim(); if (!code) return;
  const it = S.items.find(i => i.barcode === code) || (/^\d{12}$/.test(code) ? S.items.find(i => i.barcode === '0' + code) : null);
  if (it) {
    S.recent = [it.barcode].concat(S.recent.filter(r => r !== it.barcode)).slice(0, 12); save();
    if (view === 'scan') render();
    toast(tr('✓ Found: ','✓ مل گیا: ') + iName(it)); openItem(it.id);
  } else {
    toast(tr('New barcode — add the item','نیا بارکوڈ — آئٹم شامل کریں')); openEditor(null, {barcode: code});
  }
}
let camTarget = 'scan';
async function decodeImage(file){
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  if ('BarcodeDetector' in window) {
    try { const r = await new BarcodeDetector().detect(cv); if (r && r[0]) return r[0].rawValue; } catch(e) {}
  }
  const srcs = ['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js', 'https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js'];
  for (const s of srcs) { if (window.ZXing) break; try { await loadScript(s); } catch(e) {} }
  if (!window.ZXing) throw new Error('lib');
  const hints = new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  const reader = new ZXing.BrowserMultiFormatReader(hints);
  const res = await reader.decodeFromImageUrl(cv.toDataURL('image/png'));
  return res.getText();
}

    if (camTarget === 'field') { const inp = document.querySelector('#edform [name=barcode]'); if (inp) { inp.value = code; edPrev(); toast('✓ ' + code); } }
    else handleScan(code);

});
/* hardware scanner (keyboard wedge) anywhere */
let wb = '', wt = 0;
document.addEventListener('keydown', ev => {
  const tg = ev.target; if (tg && /INPUT|TEXTAREA|SELECT/.test(tg.tagName)) return;
  const now = Date.now(); if (now - wt > 80) wb = ''; wt = now;
  if (ev.key === 'Enter') { if (wb.length >= 4) { ev.preventDefault(); handleScan(wb); } wb = ''; return; }
  if (ev.key.length === 1) wb += ev.key;
});

/* ---------- printing / export ---------- */
function svgToPng(svg, W, H, px){
  return new Promise((res, rej) => {
    const pxmm = px || 12; const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = Math.round(W*pxmm); c.height = Math.round(H*pxmm); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/png')); };
    img.onerror = rej;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

  }
  if (!DL) { toast(tr('Downloads are not available in this view','یہاں ڈاؤن لوڈ دستیاب نہیں')); return false; }
  try { await DL.save({filename, data}); toast('✓ ' + filename); return true; }
  catch(e) { if (e && e.code === 'declined') toast(tr('Download cancelled','ڈاؤن لوڈ منسوخ')); else toast(tr('Download failed','ڈاؤن لوڈ نہیں ہو سکا') + ' (' + ((e && e.code) || 'error') + ')'); return false; }

/* ---- native printer languages ---- */
const ascii = t => String(t).normalize('NFKD').replace(/[^\x20-\x7e]/g, '').replace(/"/g, "'");
function groups(){ if (GROUPS_OVERRIDE) return GROUPS_OVERRIDE; return S.queue.map(q => ({it:S.items.find(i => i.id === q.id), qty:q.qty})).filter(g => g.it && g.qty > 0); }
function bcData(code){ const e = encode(code); return e.type === 'EAN-13' ? {ean:true, d12:e.text.slice(0, 12), full:e.text} : {ean:false, full:e.text}; }

function buildTSPL(p){
  const dpi = p.dpi || 203, D = mm => Math.round(mm * dpi / 25.4), big = dpi >= 300 ? 1 : 0;
  let out = '';
  groups().forEach(({it, qty}) => {
    const L = labelOf(it), f = L.fields, [W, H] = L.size.split('x').map(Number), X = D(W), Y = D(H), m = D(1.5);
    const fh = ['', 12, 20, 24, 32, 48], fw = ['', 8, 12, 16, 24, 32];
    const F = n => Math.min(5, n + big), cw = n => fw[F(n)], ch = n => fh[F(n)];
    const fit = (t, n) => { const k = Math.floor((X - 2*m) / cw(n)); t = ascii(t); return t.length > k ? t.slice(0, k - 1) : t; };
    let y = m; const c = [];
    c.push('SIZE ' + W + ' mm,' + H + ' mm', 'GAP ' + (p.gap ?? 2) + ' mm,0 mm', 'DIRECTION 1', 'REFERENCE 0,0', 'DENSITY ' + (p.density || 8), 'SPEED 4', 'CODEPAGE 1252', 'CLS');
    const tag = (f.halal ? 'HALAL ' : '') + (f.veg && it.veg ? (it.veg === 'veg' ? 'VEG' : 'NON-VEG') : '');
    if (tag.trim()) c.push('TEXT ' + (X - m - tag.trim().length * cw(1)) + ',' + m + ',"' + F(1) + '",0,1,1,"' + tag.trim() + '"');
    if (f.shop) { c.push('TEXT ' + m + ',' + y + ',"' + F(2) + '",0,1,1,"' + fit(S.settings.shop.toUpperCase() + (f.phone && S.settings.phone ? ' ' + S.settings.phone : ''), 2) + '"'); y += ch(2) + 4; }
    if (f.name) { c.push('TEXT ' + m + ',' + y + ',"' + F(3) + '",0,1,1,"' + fit(it.name, 3) + '"'); y += ch(3) + 4; }
    { const mt = [f.weight && it.weight ? it.weight : '', f.cat ? catOf(it.cat).name : '', f.batch ? 'Batch ' + batchOf(it) : ''].filter(Boolean).join('  '); if (mt) { c.push('TEXT ' + m + ',' + y + ',"' + F(1) + '",0,1,1,"' + fit(mt, 1) + '"'); y += ch(1) + 4; } }
    if (f.mfg || f.exp) { const [md, ed] = dates(it); if (f.mfg) c.push('TEXT ' + m + ',' + y + ',"' + F(1) + '",0,1,1,"MFG ' + md + '"'); if (f.exp) c.push('TEXT ' + (f.mfg ? Math.round(X/2) + D(1) : m) + ',' + y + ',"' + F(1) + '",0,1,1,"EXP ' + ed + '"'); y += ch(1) + 6; }
    const ps = ascii(money(it.price)), pw = ps.length * cw(4);
    const bh = Y - y - m - ch(1) - 6;
    if (f.barcode && it.barcode && bh > 20) {
      const b = bcData(it.barcode);
      c.push('BARCODE ' + m + ',' + y + ',"' + (b.ean ? 'EAN13' : '128') + '",' + bh + ',1,0,2,2,"' + (b.ean ? b.d12 : ascii(b.full)) + '"');
      if (f.price) c.push('TEXT ' + Math.max(m, X - m - pw) + ',' + (y + Math.round(bh/2) - Math.round(ch(4)/2)) + ',"' + F(4) + '",0,1,1,"' + ps + '"');
    } else if (f.price) c.push('TEXT ' + m + ',' + y + ',"' + F(4) + '",0,1,1,"' + ps + '"');
    c.push('PRINT 1,' + qty);
    out += c.join('\r\n') + '\r\n';
  });
  return out;
}
function buildZPL(p){
  const dpi = p.dpi || 203, D = mm => Math.round(mm * dpi / 25.4);
  let out = '';
  groups().forEach(({it, qty}) => {
    const L = labelOf(it), f = L.fields, [W, H] = L.size.split('x').map(Number), X = D(W), Y = D(H), m = D(1.5);
    const h1 = D(H * 0.075), h2 = D(H * 0.12), h3 = D(H * 0.065), hp = D(H * 0.15);
    let y = m; const c = ['^XA', '^CI28', '^PW' + X, '^LL' + Y, '^MD' + Math.round(((p.density || 8) - 8) * 2), '^PQ' + qty];
    const T = (x, yy, h, t, w, al) => '^FO' + x + ',' + yy + (w ? '^FB' + w + ',1,0,' + (al || 'L') : '') + '^A0N,' + h + ',' + h + '^FD' + ascii(t).replace(/[\^~]/g, '') + '^FS';
    const tag = ((f.halal ? 'HALAL ' : '') + (f.veg && it.veg ? (it.veg === 'veg' ? 'VEG' : 'NON-VEG') : '')).trim();
    if (tag) c.push(T(m, m, h3, tag, X - 2*m, 'R'));

      if (await confirmBox('🗂️', tr('Delete ','ڈیلیٹ کریں: ') + '"' + cName(c) + '"?', n ? n + tr(' items will also be deleted.',' آئٹمز بھی ڈیلیٹ ہوں گے۔') : tr('The category will be deleted.','کیٹیگری ڈیلیٹ ہو جائے گی۔'), tr('Delete','ڈیلیٹ'), true)) {
        S.categories = S.categories.filter(x => x.id !== id); const gone = S.items.filter(i => i.cat === id).map(i => i.id);
        S.items = S.items.filter(i => i.cat !== id); S.queue = S.queue.filter(q => !gone.includes(q.id)); if (curCat === id) curCat = 'all'; save(); closeSheet(); render(); }
      break; }
    case 'lang': S.settings.lang = UR() ? 'en' : 'ur'; save(); render(); break;
    case 'setlang': S.settings.lang = a.dataset.v; save(); render(); break;
    case 'photo': phTarget = 'item'; $('#photofile').click(); break;
    case 'photorm': editing.photo = ''; $('#phbox').innerHTML = phBox(); break;
    case 'logo': phTarget = 'logo'; $('#photofile').click(); break;
    case 'logorm': S.settings.logo = ''; save(); render(); break;
    case 'lreset': S.settings.label = DEF_LABEL(); save(); render(); toast(tr('Default design restored','ڈیفالٹ ڈیزائن واپس آ گیا')); break;
    case 'clrrec': S.recent = []; save(); render(); break;
    case 'export': saveFile('bakery-backup-' + fmtD(new Date()) + '.json', JSON.stringify(S, null, 1)); break;
    case 'import': $('#impfile').click(); break;
    case 'csv': csv(); break;
    case 'reset': if (await confirmBox('⚠️', tr('Reset demo data?','ڈیمو ڈیٹا ری سیٹ کریں؟'), tr('All your items and categories will be replaced by demo data.','آپ کے تمام آئٹمز اور کیٹیگریز کی جگہ ڈیمو ڈیٹا آ جائے گا۔'), tr('Reset','ری سیٹ'), true)) { S = seed(); save(); curCat = 'all'; render(); toast(tr('Reset done','ری سیٹ ہو گیا')); } break;
  }
});
function renderStats(){ const st = document.querySelectorAll('.stat b'); if (st[2]) st[2].textContent = S.queue.reduce((a, q) => a + q.qty, 0); }
function updLPrev(){ const p = $('#lprev'); if (!p) return; const it = S.items.find(i => i.id === lblSample) || S.items[0]; if (it) p.innerHTML = labelSVG(it, S.settings.label, Math.min(330, window.innerWidth - 80)); }
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q') { qStr = t.value; renderGrid(); return; }
  if (t.dataset.lc) { const scope = t.closest('.lc').dataset.scope; const L = scope === 'default' ? S.settings.label : editing.label; applyLC(L, t);
    if (t.dataset.lc === 'color') t.closest('.lc').querySelectorAll('.swc').forEach(s => s.classList.remove('on'));
    if (scope === 'default') { save(); updLPrev(); } else edPrev(); return; }
  if (t.closest('#edform')) { edPrev(); return; }
  if (t.dataset.set) { S.settings[t.dataset.set] = t.value; save(); return; }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'lsample') { lblSample = t.value; updLPrev(); }
  if (t.dataset.qty) { qAdd(t.dataset.qty, Math.max(0, +t.value || 0), true); render(); }
  if (t.dataset.lc === 'w' || t.dataset.lc === 'h') { const box = t.closest('.lc'); const scope = box.dataset.scope; const L = scope === 'default' ? S.settings.label : editing.label; box.outerHTML = labelCtrls(L, scope); }
});
document.addEventListener('submit', ev => {
  if (ev.target.id === 'edform') { ev.preventDefault(); saveEditor(); }
  if (ev.target.id === 'scanform') { ev.preventDefault(); const v = $('#scanin').value; $('#scanin').value = ''; handleScan(v); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== view && ['home','labels','scan','print','more'].includes(h)) { view = h; render(); } });

/* ---------- boot ---------- */
function hideSplash(){ const s = $('#splash'); s.classList.add('hide'); setTimeout(() => s.remove(), 500); try { sessionStorage.setItem('bk-splash', '1'); } catch(e) {} }
let seen = false; try { seen = sessionStorage.getItem('bk-splash'); } catch(e) {}
if (seen) $('#splash').remove(); else setTimeout(hideSplash, 1700);
render();
(function hook(n){
  if (!(window.claude && window.claude.use)) { if (n < 40) setTimeout(() => hook(n + 1), 250); return; }
  window.claude.use('artifact').then(a => { ART = a; if (!a) return; if (dirty) schedulePublish(); else { syncState = 'saved'; setSync(); } }).catch(() => {});
  window.claude.use('downloads').then(d => { DL = d; }).catch(() => {});
})(0);
</script>
